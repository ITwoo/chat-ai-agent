[project]
name = "api-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ITwoo", email = "19192r8@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
