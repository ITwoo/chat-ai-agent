[project]
name = "api-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ITwoo", email = "19192r8@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-socketio>=5.17.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api-python = "api_python.main:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
