services:
  redis:
    image: redis:8-alpine
    container_name: chat-ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  analysis-service:
    build:
      context: .
      dockerfile: apps/analysis-service/Dockerfile
    env_file:
      - ./apps/analysis-service/.env.docker.local
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env.docker.local
    expose:
      - "3000"
    depends_on:
      analysis-service:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env.docker.local
    command: ["node", "dist/worker.js"]
    depends_on:
      redis:
        condition: service_started
      analysis-service:
        condition: service_healthy
    restart: always
    
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    volumes:
    - ./apps/web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
volumes:
  redis-data: