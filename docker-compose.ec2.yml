services:
  redis:
    image: redis:8-alpine
    container_name: chat-ai-agent-redis
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    image: ghcr.io/itwoo/chat-ai-agent-api:${IMAGE_TAG}
    container_name: chat-ai-agent-api
    env_file:
      - /home/ec2-user/env/chat-ai-agent-api.env
    expose:
      - "3000"
    volumes:
      - /home/ec2-user/data/rag:/app/apps/api/uploads/rag
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/itwoo/chat-ai-agent-web:${IMAGE_TAG}
    container_name: chat-ai-agent-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
volumes:
  redis-data: