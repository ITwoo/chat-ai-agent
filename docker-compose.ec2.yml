services:
  redis:
    image: redis:8-alpine
    container_name: chat-ai-agent-redis
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mcp:
    image: ghcr.io/itwoo/chat-ai-agent-mcp:${IMAGE_TAG}
    container_name: chat-ai-agent-mcp
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  api:
    image: ghcr.io/itwoo/chat-ai-agent-api:${IMAGE_TAG}
    container_name: chat-ai-agent-api
    env_file:
      - /home/ec2-user/env/chat-ai-agent-api.env
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/itwoo/chat-ai-agent-web:${IMAGE_TAG}
    container_name: chat-ai-agent-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  redis-data: